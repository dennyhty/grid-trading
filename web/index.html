<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>量化交易</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button id="back" class="ghost hidden" aria-label="返回">‹ 返回</button>
  <div class="brand">
    <div class="name">QUANT</div>
    <div class="sub" id="subtitle">訊號列表</div>
  </div>
  <button id="bell" class="ghost bell" aria-label="通知中心">🔔<span id="badge" class="badge hidden">0</span></button>
</header>

<nav class="nav" id="nav">
  <a href="#" data-page="signals" class="active">訊號</a>
  <a href="#perf" data-page="perf">績效</a>
  <a href="#research" data-page="research">策略研究</a>
</nav>

<main>
  <!-- 列表 -->
  <section id="list-view">
    <div class="tabs mtabs-row">
      <button class="mtab" data-market="crypto">加密貨幣 <span></span></button>
      <button class="mtab" data-market="stock">美股 <span></span></button>
      <button class="mtab" data-market="commodity">商品 <span></span></button>
    </div>
    <div class="tabs ivtabs hidden" id="grouptabs"></div>
    <div class="tabs ivtabs hidden" id="ivtabs"></div>
    <div id="stats" class="panel stats"></div>
    <div class="tabs">
      <button class="tab active" data-tab="OPEN">進行中 <span id="n-open"></span></button>
      <button class="tab" data-tab="CLOSED">已結束 <span id="n-closed"></span></button>
    </div>
    <div id="cards"></div>
    <p class="foot" id="foot"></p>
  </section>

  <!-- 單一訊號圖表 -->
  <section id="detail-view" class="hidden">
    <div class="panel" id="detail-head"></div>
    <div class="panel chart-panel" id="chart-panel">
      <div class="controls">
        <label>週期
          <select id="interval"></select>
        </label>
        <span class="muted" id="interval-note">原訊號週期</span>
      </div>
      <div class="buttons">
        <button id="btn-signal">回到訊號</button>
        <button id="btn-live">最新價格・即時</button>
        <button id="btn-full">全螢幕</button>
        <button id="btn-more">▶ 更多</button>
      </div>
      <div id="more" class="more hidden">
        <label><input type="checkbox" id="opt-levels" checked> 顯示 TP / SL 線</label>
        <label><input type="checkbox" id="opt-emas" checked> 顯示均線</label>
        <label><input type="checkbox" id="opt-ind" checked> 顯示 RSI / MACD</label>
        <div id="legend" class="legend"></div>
      </div>
      <div class="live-line"><span id="live-dot" class="dot"></span> <b>即時現價</b>
        <span class="muted" id="live-hint">點「最新價格」開啟即時更新</span></div>
      <div class="kinfo" id="kinfo"></div>
      <div id="chart"></div>
      <div id="panes" class="panes">
        <div class="pane-tag">RSI(14)　<i style="--c:#22c58b">54–70 做多</i>　<i style="--c:#f0697a">30–46 做空</i></div>
        <div id="rsi-chart" class="sub-chart rsi"></div>
        <div class="pane-tag">MACD(12,26,9)　<i style="--c:#4fb3d9">DIF</i>　<i style="--c:#e6c35c">DEA</i>　柱狀體</div>
        <div id="macd-chart" class="sub-chart"></div>
      </div>
    </div>
    <div class="panel" id="detail-levels"></div>
    <div class="panel" id="detail-size"></div>
  </section>

  <!-- 績效：幣安自動交易 + 維加斯實盤規則回測（perf.js） -->
  <section id="perf-view" class="page hidden"></section>

  <!-- 策略研究：報告索引與全文（perf.js） -->
  <section id="research-view" class="page hidden"></section>
</main>

<!-- 通知中心 -->
<div id="notif" class="sheet hidden">
  <div class="sheet-head">
    <b>通知中心</b>
    <div>
      <button id="notif-perm" class="small">開啟手機/瀏覽器通知</button>
      <button id="notif-close" class="ghost">✕</button>
    </div>
  </div>
  <div id="notif-list"></div>
</div>

<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script src="app.js"></script>
<script src="perf.js"></script>
</body>
</html>
