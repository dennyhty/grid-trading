name: probe binance (temporary)
on:
  push:
    branches: [claude/project-thread-llmyex]
    paths: [".github/workflows/probe-binance.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=2h&limit=2" \
            "https://fapi1.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=2h&limit=2" \
            "https://www.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=2h&limit=2" \
            "https://www.binance.com/fapi/v1/ticker/price?symbol=BTCUSDT" \
            "https://www.binance.com/fapi/v1/premiumIndex?symbol=BTCUSDT" \
            "https://www.binance.com/fapi/v1/exchangeInfo" \
            "https://www.binance.com/futures/data/openInterestHist?symbol=BTCUSDT&period=4h&limit=1" \
            "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=2h&limit=2" ; do
            code=$(curl -s -o body.txt -w '%{http_code}' --max-time 20 "$u"); echo "$code $u :: $(head -c 160 body.txt)"; echo
          done
          for i in $(seq 1 40); do curl -s -o /dev/null -w '%{http_code} ' "https://www.binance.com/fapi/v1/klines?symbol=ETHUSDT&interval=1h&limit=1000"; done; echo
