# 每 10 分鐘掃描一次訊號，把網頁和資料推到 gh-pages 分支，由 GitHub Pages 提供網址。
# 只用派網公開行情，不需要任何金鑰。
name: 訊號網頁

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub 排程常會延遲幾分鐘
  workflow_dispatch:
  push:
    branches: [main, claude/project-thread-t012rc]
    paths: ["web/**", "grid_trading/**", "signal_*.py", "stats/**", ".github/workflows/pages.yml"]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 取得上一次的通知紀錄
        run: |
          git fetch --depth=1 origin gh-pages && git show origin/gh-pages:data/notifications.json > previous_notifications.json || echo "[]" > previous_notifications.json
      - name: 掃描訊號、產生網站
        run: python signal_snapshot.py --out site --previous previous_notifications.json
      - name: 推到 gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "訊號快照 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
