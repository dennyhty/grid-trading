# 每 15 分鐘掃描一次訊號，把網頁和資料直接發佈到 GitHub Pages。
# 只用公開行情（派網 K 線；訂單流觀察組另外讀幣安的公開持倉量），不需要任何金鑰。
# 需要的設定：Settings → Pages → Source 選「GitHub Actions」。
name: 訊號網頁

on:
  schedule:
    - cron: "2,17,32,47 * * * *"   # 備用；實際由「訊號定時器」在收盤前 75 秒觸發（GitHub 排程常延遲或不觸發）
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "傳一則 Telegram 測試訊息"
        type: boolean
        default: false
  push:
    branches: [main, claude/project-thread-t012rc]
    paths: ["web/**", "reports/**", "grid_trading/**", "signal_*.py", "stats/**", ".github/workflows/pages.yml"]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # 通知紀錄、訊號、實盤紀錄都從目前的網站接著用。只有 404（網站還沒有這個檔）才從頭開始；
      # 其他錯誤就不部署，免得通知紀錄被清空（這一輪的新訊號會被當成「第一次啟動」而不推播）、
      # 或下一輪把同樣的通知再推一次。網址加時間參數，避免拿到 CDN 快取的舊版。
      - name: 取得上一次的通知紀錄、訊號、實盤紀錄（從目前的網站）
        run: |
          owner="${GITHUB_REPOSITORY%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          fetch() {
            code=$(curl -sS --retry 3 --retry-delay 5 -H 'Cache-Control: no-cache' -o "$2" -w '%{http_code}' \
              "https://${owner}.github.io/${repo}/data/$1?t=$(date +%s)") || code="curl 失敗"
            if [ "$code" = "404" ]; then echo "$3" > "$2"
            elif [ "$code" != "200" ]; then echo "讀取 $1 失敗：HTTP $code"; exit 1; fi
          }
          fetch notifications.json previous_notifications.json '[]'
          fetch state.json previous_state.json '{}'
          fetch ledger.json previous_ledger.json '[]'
      # 訊號定時器在收盤前 75 秒觸發：機器和套件先準備好，等到收盤後 15 秒再掃描，K 線才確定收完
      - name: 等 K 線收盤
        if: github.event_name != 'push'
        run: |
          r=$(( $(date +%s) % 900 ))   # 距離上一個 :00/:15/:30/:45 幾秒
          if [ "$r" -ge 720 ]; then wait=$(( 900 - r + 15 )); elif [ "$r" -lt 15 ]; then wait=$(( 15 - r )); else wait=0; fi
          echo "等 $wait 秒到收盤後 15 秒"; sleep "$wait"
      # 2H / 4H 剛收盤時，先只掃加密貨幣的實盤策略、馬上推 Telegram（約收盤後 1 分鐘），
      # 再做完整掃描、圖表、部署；完整的 outbox 會跳過已經送過的
      - name: 掃描訊號、產生網站
        run: python signal_snapshot.py --out site --previous previous_notifications.json --ledger previous_ledger.json --previous-state previous_state.json --early-push early_sent.json
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # 幣安自動交易（VPS 上的 deploy/trader_feed.py）的紀錄，給網站的「績效」頁。
      # 沒設 TRADER_FEED_URL 或 VPS 連不上，就沿用目前網站上的那一份，不影響訊號部署。
      - name: 取得幣安自動交易紀錄
        env:
          FEED: ${{ secrets.TRADER_FEED_URL }}
        run: |
          owner="${GITHUB_REPOSITORY%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          ok() { python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert isinstance(d.get('books'), dict)" "$1" 2>/dev/null; }
          if [ -n "$FEED" ] && curl -sS --max-time 20 --retry 2 -o trader_new.json "$FEED" && ok trader_new.json; then
            echo "已從 VPS 更新"
          elif curl -sS --retry 3 -H 'Cache-Control: no-cache' -o trader_new.json \
              "https://${owner}.github.io/${repo}/data/trader.json?t=$(date +%s)" && ok trader_new.json; then
            echo "VPS 沒回應或沒設定，沿用網站上的上一份"
          else
            echo '{"books":{}}' > trader_new.json; echo "還沒有自動交易紀錄"
          fi
          mv trader_new.json site/data/trader.json
      - name: 整理要推到 Telegram 的新通知
        run: python signal_telegram.py outbox site/data previous_notifications.json outbox.json early_sent.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-outbox
          path: outbox.json
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 網站部署成功後才推 Telegram，免得部署失敗時下一次重送。
  # Bot Token 和 Chat ID 放在 Settings → Secrets and variables → Actions，沒設定就跳過。
  telegram:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: signal_telegram.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: telegram-outbox
      - run: python3 signal_telegram.py send outbox.json
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: ${{ inputs.test_telegram }}
 

  # 訊號定時器的機器偶爾會中途斷掉（例如 2026-10-15 00:38 UTC），接力就斷了，只剩這裡很稀疏的備用排程。
  # 備用排程每次觸發時檢查一下：沒有定時器在跑就重開一個。
  watchdog:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: 定時器斷了就重開
        run: |
          running=0
          for s in in_progress queued; do
            n=$(gh run list --repo "$REPO" --workflow ticker.yml --status "$s" --json databaseId --jq length)
            running=$(( running + n ))
          done
          if [ "$running" -eq 0 ]; then
            echo "沒有定時器在跑，重開一個"
            gh workflow run ticker.yml --repo "$REPO" --ref "$BRANCH"
          else
            echo "定時器正常（$running 個在跑）"
          fi
