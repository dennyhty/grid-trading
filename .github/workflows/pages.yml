# 每 5 分鐘掃描一次訊號，把網頁和資料直接發佈到 GitHub Pages。
# 只用派網公開行情，不需要任何金鑰。
# 需要的設定：Settings → Pages → Source 選「GitHub Actions」。
name: 訊號網頁

on:
  schedule:
    - cron: "*/5 * * * *"   # 每 5 分鐘（GitHub 最短就是 5 分鐘），排程常會延遲幾分鐘
  workflow_dispatch:
  push:
    branches: [main, claude/project-thread-t012rc]
    paths: ["web/**", "grid_trading/**", "signal_*.py", "stats/**", ".github/workflows/pages.yml"]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 取得上一次的通知紀錄（從目前的網站）
        run: |
          owner="${GITHUB_REPOSITORY%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          curl -fsS "https://${owner}.github.io/${repo}/data/notifications.json" -o previous_notifications.json \
            || echo "[]" > previous_notifications.json
      - name: 掃描訊號、產生網站
        run: python signal_snapshot.py --out site --previous previous_notifications.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
