name: probe
on:
  push:
    branches: [claude/signal-app-0v6ppc]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for s in NVDAUSDT XAUUSDT SPYUSDT; do for p in 4h 2h; do curl -sS "https://www.binance.com/futures/data/openInterestHist?symbol=$s&period=$p&limit=2" | head -c 200; echo; done; done
